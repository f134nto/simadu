              const key = `${activeClass}-${student}`;
              const data = gradesData[key] || {};
              
              const parseG = (v) => (v !== undefined && v !== '' ? parseFloat(v) : null);
              
              const s1 = parseG(data.s1);
              const s2 = parseG(data.s2);
              const s3 = parseG(data.s3);
              const s4 = parseG(data.s4);
              const s5 = parseG(data.s5);
              const asts = parseG(data.asts);
              
              const components = [s1, s2, s3, s4, s5, asts];
              const validComponents = components.filter(c => c !== null);
              
              const jml = validComponents.reduce((a, b) => a + b, 0);
              const rata2 = validComponents.length > 0 ? (jml / validComponents.length) : 0;
              const p80 = rata2 * 0.8;
              
              const asas = parseG(data.asas) || 0;
              const p20 = parseG(data.asas) !== null ? asas * 0.2 : 0;
              
              const na = p80 + p20;
              
              return { jml, rata2, p80, p20, na, asas: parseG(data.asas) };

                                      <th className="py-3 px-4 font-bold border-b border-slate-200 w-12 text-center bg-[#7DA3A1] text-slate-900">No.</th>
                                      <th className="py-3 px-4 font-bold border-b border-slate-200 min-w-[200px] bg-[#7DA3A1] text-slate-900">Nama Siswa</th>
                                      <th className="py-3 px-4 font-bold border-b border-slate-200 bg-slate-50 text-slate-700 min-w-[180px]">Nominal Tabungan (Tgl {actionDay})</th>
                                      <th className="py-3 px-4 font-bold border-b border-slate-200 bg-amber-100 text-amber-900 min-w-[160px] text-right">Total Bulanan</th>
                                  </tr>
                              </thead>
                              <tbody>
                                  {currentStudents.map((student, idx) => {
                                      const key = `${activeClass}-${activeMonth}-${student}-${actionDay}`;
                                      const studentTotal = getStudentTotalSavings(student);
                                      const safeTabRowId = `tab-row-${sanitizeId(student)}`;
                                      return (
                                          <tr id={safeTabRowId} key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors duration-300">
                                              <td className="py-2 px-4 text-center font-bold text-slate-800 bg-[#7DA3A1]">{idx + 1}</td>
                                              <td className="py-2 px-4 font-bold text-slate-900 bg-[#7DA3A1]">{student}</td>
                                              <td className="py-2 px-4">
                                                  <div className="flex items-center gap-2 max-w-[200px]">
                                                      <span className="text-slate-400 text-xs font-bold">Rp</span>
                                                      <input 
                                                          type="number"
                                                          placeholder="0"
                                                          value={savingsData[key] || ''}
                                                          onChange={(e) => handleSavingChange(student, e.target.value)}
                                                          className="w-full px-3 py-1.5 border border-slate-200 rounded-md bg-white text-slate-700 font-semibold focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500"
                                                      />
                                                  </div>
                                              </td>
                                              <td className="py-2 px-4 text-right font-bold text-emerald-700 bg-amber-50/30">
                                                  Rp {studentTotal.toLocaleString('id-ID')}
                                              </td>
                                          </tr>
                                      );
                                  })}
                                  {currentStudents.length === 0 && (
                                      <tr><td colSpan="4" className="py-8 text-center text-slate-400">Pilih kelas terlebih dahulu atau Tambah Siswa Baru</td></tr>
                                  )}
                              </tbody>
                              {currentStudents.length > 0 && (
                                <tfoot className="bg-slate-100 font-bold border-t-2 border-slate-300 relative z-10">
                                  <tr>
                                    <td colSpan="2" className="py-3 px-4 text-slate-800 text-right">TOTAL HARIAN (TGL {actionDay}):</td>
                                    <td className="py-3 px-4 text-emerald-800 font-extrabold text-base">
                                      Rp {getDailyTotalSavings(actionDay).toLocaleString('id-ID')}
                                    </td>
                                    <td className="py-3 px-4 text-right text-emerald-900 font-black text-base bg-amber-200/50">
                                      Rp {currentStudents.reduce((acc, st) => acc + getStudentTotalSavings(st), 0).toLocaleString('id-ID')}
                                    </td>
                                  </tr>
                                </tfoot>
                              )}
                          </table>
                      </div>
                   </div>
                )}

              </div>
            </div>
          );
        }

        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
